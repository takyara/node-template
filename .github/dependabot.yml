version: 2
updates:
  # npm packages — commit messages: build(deps): … / build(deps-dev): …
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch updates of dev tools land in a single PR
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint only supports TypeScript < 6.1: upgrade manually once it supports 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # GitHub Actions — commit messages: ci(deps): …
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
